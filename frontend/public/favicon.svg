<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="locusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f17"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#1e293b" stroke-width="2"/>
  <!-- Concentric coordinate rings -->
  <circle cx="32" cy="32" r="22" stroke="#312e81" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="15" stroke="url(#locusGlow)" stroke-width="2"/>
  <!-- Reticle crosshairs -->
  <path d="M32 6V13M32 51V58M6 32H13M51 32H58" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
