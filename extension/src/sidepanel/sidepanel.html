<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locus Companion</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="sidepanel-app" class="sidepanel-container">
    <!-- Header & Action Bar -->
    <header class="sidepanel-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
        <span class="brand-name">LOCUS <span class="brand-sub">COMPANION</span></span>
      </div>

      <div class="header-tools">
        <button id="btn-export-ics" class="btn-icon" title="Export iCalendar (.ics)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </button>
        <button id="btn-open-notion" class="btn-icon" title="Open Notion Day Plan">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <button id="btn-sidepanel-sync" class="btn-icon" title="Sync now">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Offline Alert Banner -->
    <div id="sidepanel-offline-banner" class="offline-banner" style="display: none;">
      <span class="offline-dot"></span>
      <span class="offline-text">OFFLINE MODE — Showing deterministic heuristic plan</span>
    </div>

    <!-- Active Tab Context Detection Bar -->
    <div id="detected-context-bar" class="context-bar" style="display: none;">
      <div class="context-meta">
        <span id="context-source-badge" class="badge">JIRA</span>
        <span id="context-title" class="context-title">Detecting active task...</span>
      </div>
      <button id="btn-context-plan" class="btn btn-primary btn-sm">Insert</button>
    </div>

    <!-- Quick Prompt Re-planning Bar -->
    <div class="prompt-bar">
      <input type="text" id="prompt-input" class="prompt-input" placeholder="Plan day with Jira/GitHub or request changes...">
      <button id="btn-prompt-send" class="btn btn-primary btn-sm">Plan</button>
    </div>

    <!-- Navigation Tabs -->
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="timeline">
        Timeline <span id="count-timeline" class="tabular-nums tab-count">0</span>
      </button>
      <button class="tab-btn" data-tab="jira">
        Jira <span id="count-jira" class="tabular-nums tab-count">0</span>
      </button>
      <button class="tab-btn" data-tab="github">
        GitHub <span id="count-github" class="tabular-nums tab-count">0</span>
      </button>
      <button class="tab-btn" data-tab="swarm">
        Swarm <span id="count-swarm" class="tabular-nums tab-count">8</span>
      </button>
    </nav>

    <!-- Tab Panes -->
    <main class="panes-container">
      <!-- 1. Timeline Pane -->
      <section id="pane-timeline" class="tab-pane active">
        <div id="timeline-list" class="blocks-list">
          <div class="empty-state">No schedule blocks loaded</div>
        </div>
      </section>

      <!-- 2. Jira Pane -->
      <section id="pane-jira" class="tab-pane">
        <div id="jira-list" class="tickets-list">
          <div class="empty-state">No open Jira tickets</div>
        </div>
      </section>

      <!-- 3. GitHub Pane -->
      <section id="pane-github" class="tab-pane">
        <div id="github-list" class="prs-list">
          <div class="empty-state">No open GitHub PRs</div>
        </div>
      </section>

      <!-- 4. Swarm Pane -->
      <section id="pane-swarm" class="tab-pane">
        <div class="swarm-header-row">
          <span class="section-label">MULTI-AGENT TOPOLOGY</span>
          <span id="swarm-status-badge" class="badge badge-hybrid">ACTIVE</span>
        </div>
        <div id="swarm-graph-container"></div>
        <div class="swarm-activity-log">
          <span class="section-label">AGENT TELEMETRY FEED</span>
          <div id="swarm-logs" class="swarm-logs-list">
            <div class="swarm-log-entry">⚡ 8 LangGraph autonomous agents ready.</div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Status -->
    <footer class="sidepanel-footer">
      <div class="footer-left">
        <span id="footer-verdict" class="badge badge-wfh">WFH</span>
        <span id="footer-city-weather" class="footer-caption">--</span>
      </div>
      <span id="footer-synced" class="tabular-nums footer-synced">--</span>
    </footer>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
