<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locus HUD</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
        <span class="brand-title">LOCUS <span class="brand-sub">HUD</span></span>
      </div>
      <div class="header-actions">
        <span id="offline-pill" class="badge badge-offline" style="display: none;">OFFLINE</span>
        <button id="btn-sync" class="btn-icon" title="Sync now">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Verdict Hero -->
    <section class="card verdict-card">
      <div class="verdict-header">
        <span class="section-label">RECOMMENDED DISPOSITION</span>
        <div id="verdict-badge" class="badge badge-wfh glow-indigo">WFH</div>
      </div>
      <div id="verdict-reason" class="verdict-reason">
        Analyzing real-time weather and sprint workload...
      </div>
    </section>

    <!-- Telemetry Metrics Grid -->
    <div class="metrics-grid">
      <div class="card metric-card">
        <span class="metric-label">WEATHER SCORE</span>
        <div class="metric-value-row">
          <span id="metric-weather-score" class="tabular-nums metric-num">--</span>
          <span class="metric-sub">/ 100</span>
        </div>
        <span id="metric-weather-desc" class="metric-caption">Loading...</span>
      </div>

      <div class="card metric-card">
        <span class="metric-label">FOCUS CAPACITY</span>
        <div class="metric-value-row">
          <span id="metric-focus-hours" class="tabular-nums metric-num">--</span>
          <span class="metric-sub">hrs</span>
        </div>
        <span id="metric-focus-desc" class="metric-caption">Sprint workload</span>
      </div>
    </div>

    <!-- Outfit Suggestion -->
    <section class="card outfit-card">
      <div class="outfit-icon">🧥</div>
      <div class="outfit-content">
        <span class="section-label">OUTFIT RECOMMENDATION</span>
        <p id="outfit-text" class="outfit-text">Loading weather attire...</p>
      </div>
    </section>

    <!-- Active Schedule Block -->
    <section class="card active-block-card">
      <div class="active-block-header">
        <span class="section-label">CURRENT FOCUS BLOCK</span>
        <span id="active-block-time" class="tabular-nums time-pill">--:--</span>
      </div>
      <div class="active-block-body">
        <input type="checkbox" id="active-block-check" class="block-checkbox">
        <label for="active-block-check" id="active-block-title" class="block-title">
          No active blocks scheduled
        </label>
      </div>
    </section>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <div class="quick-actions-row">
        <button id="btn-popup-ics" class="btn btn-secondary btn-sm" title="Export iCalendar (.ics)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Export .ics</span>
        </button>
        <button id="btn-popup-notion" class="btn btn-secondary btn-sm" title="Open Notion Day Plan">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          <span>Notion</span>
        </button>
      </div>
      <button id="btn-open-sidepanel" class="btn btn-primary btn-full">
        <span>Open Side Panel</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
      </button>
      <div class="synced-row">
        <span>Last synced: <span id="last-synced-time" class="tabular-nums">just now</span></span>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
